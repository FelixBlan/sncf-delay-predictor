name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest -v

      - name: Smoke test - generate synthetic data and train end to end
        run: |
          python src/generate_data.py --out "$RUNNER_TEMP/raw.csv" --context-dir "$RUNNER_TEMP/context"
          python src/train.py --data "$RUNNER_TEMP/raw.csv" --model-dir "$RUNNER_TEMP/models" \
            --context-dir "$RUNNER_TEMP/context"

      - name: Shipped model loads and serves
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from fastapi.testclient import TestClient
          from api import app
          client = TestClient(app)
          assert client.get("/health").json()["status"] == "ok"
          r = client.post("/predict", json={"gare_depart": "PARIS MONTPARNASSE",
                                            "gare_arrivee": "BORDEAUX ST JEAN"})
          assert r.status_code == 200, r.text
          print(r.json())
          PY

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sncf-delay-predictor .

      - name: Container answers on /health
        run: |
          docker run -d -p 8000:8000 --name api sncf-delay-predictor
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
